<body>
  <div class="screen">
    <div class="controller-wrap">
      <div class="lower-button">
        <div></div>
        <div class="arrow-up">
          <a href="#" onclick="sendCommand('forward')" class="button w-button">^</a>
        </div>
        <div></div>
      </div>
      <div class="middle">
        <div class="arrow-left">
          <a href="#" onclick="sendCommand('left')" class="button-3 w-button">&lt;</a>
        </div>
        <div class="stop-button">
          <a href="#" onclick="sendCommand('stop')" class="button-5 w-button">II</a>
        </div>
        <div class="arrow-right">
          <a href="#" onclick="sendCommand('right')" class="button-2 w-button">&gt;</a>
        </div>
      </div>
      <div class="lower-button adjust">
        <div></div>
        <div class="arrow-down">
          <a href="#" onclick="sendCommand('backward')" class="button-4 w-button">v</a>
        </div>
        <div></div>
      </div>
      <div class="extra-button-wrap">
        <div class="counter-clockwise">
          <div class="other-button-wrap">
            <a href="#" onclick="sendCommand('ccwise')" class="button-6 w-button">CC/CW</a><img src="{{ url_for('static', filename='images/circle-of-two-clockwise-arrows-rotation.svg') }}" loading="lazy" width="39" alt="" class="image">
          </div>
        </div>
        <div class="clockwise">
          <div class="other-button-wrap">
            <a href="#" id="autoToggleBtn" onclick="startAuto()" class="button-7 w-button">AUTO</a>
            <img src="{{ url_for('static', filename='images/stop.svg') }}" loading="lazy" width="43" alt="" class="image-2">
          </div>
        </div>
      </div>

  <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=683745c77e306511bf465fc4" type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
  <script src="{{ url_for('static', filename='js/webflow.js') }}" type="text/javascript"></script>
  <script>
    function sendCommand(direction) {
      fetch('/move', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: 'direction=' + direction
      }).then(response => response.text())
        .then(data => console.log(data))
        .catch(error => console.error('Error:', error));
    }
    let autoMode = false;

    function startAuto() {
      const btn = document.getElementById('autoToggleBtn');
      const url = autoMode ? '/auto_stop' : '/auto_april';
      const newLabel = autoMode ? 'AUTO' : 'STOP';

      fetch(url, { method: 'POST' })
        .then(response => response.text())
        .then(data => {
          console.log(data);
          autoMode = !autoMode;
          btn.textContent = newLabel; // Only change the text, not the image
        })
        .catch(error => {
          console.error('Error:', error);
        });
    }
  </script>
</body>
